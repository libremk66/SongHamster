name: build-push

# 推 main → 自动构建多架构镜像并推 Docker Hub（版本号取自 package.json）
# 纯文档提交请带 [skip ci]，否则照样会重新构建镜像
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/songhamster

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # APT_MIRROR 传空串：runner 在境外，走官方 Debian 源（Dockerfile 默认给国内用阿里云）
      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            APT_MIRROR=
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.get_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

      - name: Smoke test (healthz)
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -eu
          # 用刚推的 amd64 镜像起临时容器，确认 /healthz 返回的版本号对得上
          docker run -d --name sh-smoke -p 18935:8935 \
            -e SONGHAMSTER_AUTH_USER=ci -e SONGHAMSTER_AUTH_PASSWORD=ci \
            "${{ env.IMAGE }}:$VERSION" >/dev/null
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18935/healthz > /tmp/health.json 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          node -e '
            const h = JSON.parse(require("fs").readFileSync("/tmp/health.json","utf8"));
            const want = process.env.VERSION;
            if (!h.ok || h.version !== want) { console.error(`版本不符：镜像 ${h.version}，期望 ${want}`); process.exit(1); }
            console.log("healthz OK, version", h.version);
          '
          docker rm -f sh-smoke >/dev/null
